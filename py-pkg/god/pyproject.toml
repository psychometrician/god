[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# The distribution name and the import name are independent, and here they
# differ: `god` was taken on PyPI in 2016 by an unrelated package. Every example
# and every chapter says `import god` regardless.
name = "grammar-of-data"
version = "0.2.0"
description = "A grammar of data: one vocabulary for tables, in R, Python and SQL"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "psychometrician" }]
dependencies = ["duckdb>=1.0", "pandas>=2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["god*"]

# The engine reaches the wheel through `setup.py`, which copies it straight
# into the built tree after `build_py` runs. It is deliberately not listed as
# package data: that route depends on the backend's collection rules, and a
# setuptools upgrade changed them once and shipped five engine-less wheels.
