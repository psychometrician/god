<svg xmlns="http://www.w3.org/2000/svg" viewBox="-95 -112 190 224" width="1696" height="2000"
     role="img" aria-label="The god hex sticker. A slate blue hexagon with a black border, holding a face built from the grammar's own marks: R's pipe and Python's as the two eyes, the flow word `then` as the nose, and the package name as the mouth.">

  <!-- The god hex sticker.
       Standard hex geometry: 2 inches tall by 1.732 wide, pointy top, flat sides.

       **Every face mark is drawn geometry, never type.** `|` and `/` have
       different heights in almost every typeface, and a chevron set as text
       carries its own sidebearings, so equal point sizes give visibly unequal
       marks. Only the wordmark is set, and it wants a single-story `g` to match
       the sibling sticker's.

       The nose was `[ ]` until 2026-08-07, `( )` until 2026-08-14, and is now
       the word `then`. Each change kept the same test: a mark on the cover
       should be one a reader actually types. `[` and `]` appear 0 times in R,
       which is what removed them.

       **What `then` adds is that the face now says all three of god's
       spellings.** The eyes are `|>` and `>>`; the nose is the same idea in the
       text form, the one `run()` takes. Counted across the 75-sentence parity
       corpus on 2026-08-14: `|>` 172, `>>` 173, `then` 172. They move in
       lockstep because a sentence has as many `then`s as it has pipes,
       necessarily. Parentheses counted higher (287 and 295) but say something
       else: what happens inside a step, not what joins one to the next.

       **The cost, accepted rather than overlooked:** gog's nose is `/` and `|`,
       symbols like its `+` `*` eyes, so a word here weakens the rhyme that made
       the two stickers read as one construction. And this is the first face
       mark that is *set* rather than drawn, so it carries the wordmark's
       problem: `textLength` is pinned and the family must be the one with the
       single-story `g`, or it drifts between renderers. -->

  <defs>
    <!-- R's pipe. The bar is deliberately shorter than the chevron: matched
         heights read as two unrelated marks, a shorter bar reads as one token. -->
    <g id="eye-rpipe">
      <rect x="-17.5" y="-14" width="8.5" height="28"/>
      <path d="M -1.5,-14 L 11.5,0 L -1.5,14" fill="none" stroke="#000000"
            stroke-width="8.5" stroke-linejoin="miter"/>
    </g>

    <!-- Python's pipe. Nested, but with a channel between them. Spaced they read
         as "> >"; nested to touching they fuse into a single arrowhead. -->
    <g id="eye-pypipe">
      <path d="M -17,-14 L -4,0 L -17,14" fill="none" stroke="#000000"
            stroke-width="8.5" stroke-linejoin="miter"/>
      <path d="M 0,-14 L 13,0 L 0,14" fill="none" stroke="#000000"
            stroke-width="8.5" stroke-linejoin="miter"/>
    </g>

  </defs>

  <polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50"
           fill="#B9CFE2" stroke="#000000" stroke-width="11" stroke-linejoin="miter"/>

  <g fill="#000000" text-anchor="middle">
    <use href="#eye-rpipe" x="-41" y="-31"/>
    <use href="#eye-pypipe" x="39" y="-31"/>

    <!-- `then`, tight and sitting high in the nose band, which is the treatment
         the author chose on 2026-08-14 over a matched-weight and a tracked-out
         one. High so `god` below keeps its air; narrow so it reads as a mark
         rather than as a line of text.

         `textLength` is pinned for the same reason the wordmark pins it: this
         is set type, not drawn geometry, and an unpinned word is a different
         width in every renderer. -->
    <text x="0" y="14" font-size="26" textLength="54" lengthAdjust="spacingAndGlyphs"
          font-family="Avenir Next, Avenir, Futura, Century Gothic, Trebuchet MS, sans-serif"
          font-weight="700">then</text>

    <!-- Nudged two units left of the geometric centre. `god` puts an ascender on
         its last letter and a descender on its first, so its weight runs
         diagonally and true centring makes it lean right. Any tool's
         align-centre works on the bounding box and will undo this. -->
    <text x="-2" y="61" font-size="40" textLength="70" lengthAdjust="spacingAndGlyphs"
          font-family="Avenir Next, Avenir, Futura, Century Gothic, Trebuchet MS, sans-serif"
          font-weight="700">god</text>
  </g>
</svg>
