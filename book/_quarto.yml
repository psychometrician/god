project:
  type: book
  output-dir: _book

book:
  title: "god: A Grammar of Data"
  subtitle: "One vocabulary. Two languages."

  # The hex sticker, designed by the author. It is the cover rather than a
  # placeholder for one. Every mark on it is one both bindings use: the two
  # pipes as the eyes, because they are the two languages, and the parentheses
  # as the nose, because every verb in both is a call. The column brackets were
  # here until they were measured against the corpus and found to appear zero
  # times in R. `images/god-hex.svg` is the source and the marks are drawn
  # geometry rather than type, for the reason written in it.
  cover-image: images/god-hex.png
  cover-image-alt: >-
    The god hex sticker. A slate blue hexagon with a black border, holding a
    face built from the grammar's own marks: R's pipe and Python's as the two
    eyes, a pair of parentheses as the nose, and the package name as the mouth.

  # Two names, the human first, the way the sibling book does it. The model is
  # named as a co-author of the *book* rather than as a tool that helped, because
  # it wrote the prose, and "with assistance from" would understate that. The
  # copyright holder is the human either way, and a git commit is a different
  # claim entirely: that one is about who is answerable for the repository, and
  # it carries one name.
  author:
    - "psychometrician"
    - "Claude Opus 5"

  # Two dates, and only one of them moves. This is the day the book first went up
  # as a public website, written out in full so no render can change it. Its
  # partner `date-modified` re-stamps on every build and lives in `index.qmd`'s
  # front matter rather than here: `book:` rejects the key outright, and setting
  # it at this file's top level would stamp an "Updated" row onto all 29 chapter
  # pages, when only the landing page is a record of anything. Both labels are
  # renamed under `language:` below.
  date: "2026-08-07"

  # The site is served from a repository holding only the *rendered* book, so
  # "edit this page" has no source file to open and is left off. An issue link
  # still works, and is how a reader reports a mistake. `site-url` is not needed
  # to serve the book; it is what gives the pages canonical URLs and a sitemap.
  repo-url: https://github.com/psychometrician/god
  repo-actions: [issue]
  site-url: https://psychometrician.github.io/god-book/

  page-footer:
    left: |
      [Prose licensed [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/).]{.licence}
      [Code samples licensed [Apache 2.0](https://www.apache.org/licenses/LICENSE-2.0).]{.licence}
      [Both in this book's own words: [LICENSE.md](https://psychometrician.github.io/god-book/LICENSE.md).]{.licence}
    # The center holds a reader count on the published site and nowhere else. It
    # is an image, and the image *is* the counter, so every browser that opens a
    # page fetches it, `localhost` among them. Left in this file it would count
    # each of the 40 files rendered while writing as a reader. It lives in
    # `_quarto-publish.yml`, which the workflow merges over this one and a local
    # render never loads. That file says the rest.
    right:
      # The four the sibling book ends with, in the same order, drawn from
      # Bootstrap Icons in `currentColor` so they take the theme with them.
      #
      # **All four are the author's rather than god's, and three are shared with
      # gog unchanged.** There is no `goddeveloper` on either network and there
      # should not be: the account named below displays as *psychometrician* and
      # already speaks for both projects, the same way one blog carries posts
      # about both. A second set of handles would split one voice in two.
      #
      # That is also why the labels say "psychometrician" rather than "god". A
      # reader who follows the mark arrives at a person who writes both
      # grammars, and a label promising god's own account would be wrong at the
      # moment it mattered.
      - icon: twitter-x
        href: https://x.com/gogdeveloper
        aria-label: "psychometrician on X"
        target: _blank
      - icon: bluesky
        href: https://bsky.app/profile/gogdeveloper.bsky.social
        aria-label: "psychometrician on Bluesky"
        target: _blank
      # The profile rather than this repository. A reader who wants the source
      # has "Report an issue" in the margin of every page.
      - icon: github
        href: https://github.com/psychometrician
        aria-label: "psychometrician on GitHub"
        target: _blank
      # The blog, which is where posts about god go: this repository publishes
      # nothing and god gets no site of its own. `journal-text` rather than
      # `book`, because the site uses `book` for this manual and the two marks
      # must not be mistakable for each other by a reader who meets both.
      - icon: journal-text
        href: https://psychometrician.github.io/
        aria-label: "psychometrician, the blog"
        target: _blank

  # A toggle that folds away the chapter sidebar and the table of contents,
  # leaving the prose and the tables the whole width. Off until the reader asks
  # for it, and the browser remembers the choice across pages. Wide output is
  # what makes it worth having: a table with a dozen columns is the first thing
  # to benefit from the two columns going away.
  reader-mode: true

  # **Parts group the work, chapters are one topic each.** The order is a
  # teaching order: the six verbs first, because a reader who stops after Part I
  # can already answer real questions, then reshaping, then everything that goes
  # *inside* a verb, then the parts that need more than one table or more than
  # one row. A reader arriving from another tool can start at Part VII or at the
  # appendices and work backwards.
  #
  # A chapter arrives **with** the verbs it documents rather than before them.
  # Prose can name anything at all and still build clean, which is the one defect
  # no live chunk can catch.
  # File names carry no numbers, and that is a rule rather than a style. The
  # order is this list's alone; a number in a file name restates it, and two
  # spellings of one order drift the day a chapter is inserted, which this book
  # plans to keep doing.
  chapters:
    - index.qmd

    - part: parts/six-verbs.qmd
      chapters:
        - chapters/first-pipeline.qmd
        - chapters/keeping-rows.qmd
        - chapters/choosing-columns.qmd
        - chapters/adding-a-column.qmd
        - chapters/sorting-and-taking.qmd
        - chapters/summarizing-by-group.qmd
        - chapters/renaming-and-repeats.qmd
        - chapters/words-that-repeat.qmd

    - part: parts/shape.qmd
      chapters:
        - chapters/columns-into-rows.qmd
        - chapters/rows-into-columns.qmd

    - part: parts/values.qmd
      chapters:
        - chapters/tidying-text.qmd
        - chapters/converting-kinds.qmd
        - chapters/dates.qmd
        - chapters/one-way-or-another.qmd
        - chapters/missing-values.qmd

    - part: parts/more-tables.qmd
      chapters:
        - chapters/another-table.qmd
        - chapters/has-a-partner.qmd
        - chapters/adding-rows.qmd

    - part: parts/along-the-rows.qmd
      chapters:
        - chapters/each-row-a-place.qmd
        - chapters/the-total-so-far.qmd

    - part: parts/choosing-columns.qmd
      chapters:
        - chapters/shape-of-a-name.qmd
        - chapters/what-a-column-holds.qmd
        - chapters/one-value-per-column.qmd

    - part: parts/how-it-works.qmd
      chapters:
        - chapters/nothing-runs-yet.qmd
        - chapters/what-it-wrote.qmd
        - chapters/somewhere-else.qmd
        - chapters/every-refusal.qmd

    # Outside every part, because they belong to all of them: one question
    # answered with most of the vocabulary at once, and then where this grammar
    # stops and the sibling one starts.
    - chapters/a-whole-question.qmd
    - chapters/with-gog.qmd

  appendices:
    - appendices/a-two-languages.qmd
    - appendices/b-every-word.qmd
    - appendices/c-phrasebook.qmd

# The provenance layer: the grammar's ideas are old, and the book says whose
# they are. APA because the sibling book uses it, and one style across the two
# books is the same rule as one spelling across the two languages.
bibliography: references.bib
csl: apa.csl

# Quarto's default labels for the two dates above are "Published" and
# "Modified". Both are renamed rather than accepted: "Published" alone reads as
# one date when there are two, and "Modified" describes a file where the reader
# wants to know how current the book is.
language:
  title-block-published: "First published"
  title-block-modified: "Updated"

format:
  html:
    # Two themes and a toggle. Declaring both is what makes Quarto write the
    # switch and put `quarto-light` / `quarto-dark` on the body. The palette in
    # both files is the hex sticker's, because that sticker is the only original
    # brand art this project has.
    theme:
      light: [cosmo, theme-light.scss]
      dark: [darkly, theme-dark.scss]
    toc: true
    # Two rather than three, because the third level is the tab labels. Every
    # example is an R tab and a Python tab, and a table of contents reading
    # "R, Python, R, Python" down the page is worse than no entry at all.
    #
    # **So every subsection of a chapter is `##`, with no exceptions**, and the
    # reason is worse than a missing entry in the sidebar. A `###` in a chapter
    # that has no `##` above it is numbered `19.0.1` on the page, because there
    # is no section 19.1 for it to sit under. Thirteen of them shipped that way
    # in eight chapters before anyone looked at a rendered heading. Level three
    # is left for a page that has real `##` parents and no tabsets, which is the
    # preface and the dialect blocks in Appendix C.
    toc-depth: 2
    number-sections: true
    code-link: false
    code-copy: true
    # Both languages, side by side, everywhere. The whole claim of this book is
    # that the two sentences are the same sentence, and a reader who has to
    # scroll to compare them cannot check that claim. That is why the examples
    # are tabs rather than two chapters: the comparison is one click, in place,
    # and neither language is the one you have to go and look up.
    code-block-bg: true
    code-overflow: wrap
    # Every table on the page is a table, rather than a picture of a terminal.
    # A pipeline hands this setting straight through, so both languages print
    # the same way and neither one picks a format of its own.
    df-print: kable

# Freeze stays off, and it has to. The tables in this book are computed by the
# engine binary rather than by the `.qmd`, and freeze invalidates on `.qmd`
# changes. After an engine change it would serve stale results while the book
# claims to be live, which is the exact failure the live-chunk rule exists to
# prevent.
execute:
  freeze: false
  # A refusal is shown on purpose in several chapters, with `#| error: true`.
  # What is not wanted is the engine's own startup chatter or a driver's
  # deprecation notice landing in the middle of an example.
  warning: false
  message: false
