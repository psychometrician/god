# The publish profile: what the book is given when it is built for the site, and
# at no other time. Quarto merges this over `_quarto.yml` when `QUARTO_PROFILE`
# is `publish`, which `.github/workflows/book.yml` sets. A local `quarto render`
# or `quarto preview` never sees it.
#
# One thing is in here, and it is here because of what it costs to have locally.

book:
  page-footer:
    # The reader count, and the count *is* the image. These pages are static
    # files on GitHub Pages, so nothing there can count a visit; hits.sh counts
    # requests for this badge instead, one per page view, because it serves the
    # image `no-store` and no browser caches it.
    #
    # Which is exactly why it cannot sit in `_quarto.yml`. Any browser opening
    # any page fetches it, `localhost` included, so every one of the 40 files
    # rendered while writing a chapter would count as a reader, over and over.
    # The number would be mostly its own author.
    #
    # **The address inside it is a label, not a place.** Nothing at hits.sh ever
    # fetches the site, and a name that could not resolve would count just as
    # happily. That is what lets this book and the sibling book and the blog
    # keep three separate numbers while sharing one domain: this one names the
    # book's own subdirectory.
    #
    # The count side is god's slate, from the hex sticker and the two themes,
    # and the badge picks its own ink from it: near-black on the slate, white on
    # the dark label. That is what lets one fixed image sit on both themes,
    # which CSS could not do for it, since a stylesheet cannot reach inside an
    # `img`.
    #
    # The label is a cool dark grey and it is not `$ink`. `#12171c` is within a
    # shade of the dark theme's page ground, `#0f1319`, so on that theme the
    # left half of the badge would disappear into the page and leave the word
    # floating beside a slate chip. `#333c45` stays in the same cool family and
    # reads as a pill on white and on the dark ground both. This is the cool
    # counterpart of the warm grey the sibling book arrived at for the same
    # reason.
    #
    # Swapping `.svg` for `/` is the public stats page, and that is where it
    # links.
    #
    # The alt text is written as `fig-alt` rather than between the brackets. An
    # image alone in a paragraph, carrying bracketed alt text, is a *figure* to
    # pandoc, so the words would land under the badge as a caption and the `alt`
    # attribute would be spent on them. Empty brackets keep it an inline image,
    # and `fig-alt` puts the sentence where a screen reader reads it.
    center: |
      [![](https://hits.sh/psychometrician.github.io/god-book.svg?style=flat-square&label=readers&color=b9cfe2&labelColor=333c45){fig-alt="Page views of this book, counted by hits.sh"}](https://hits.sh/psychometrician.github.io/god-book/)
