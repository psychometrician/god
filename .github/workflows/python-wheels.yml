# Build one Python wheel per platform, each carrying the engine it needs.
#
# The Python package is a bridge to `god-cli`, so a wheel without that binary
# installs and then cannot answer anything. Shipping it is deliberate: compiling
# Rust during `pip install` would put a toolchain on every user, and the engine
# writes a query rather than moving the data, so nothing here is large.
#
# `py-pkg/god/setup.py` does the packing. This only builds the binary for each
# target and tells that hook which tag to stamp, because **the tag a release
# needs is not the one a build machine reports**: PyPI rejects a bare
# `linux_x86_64`, and a macOS wheel claims its deployment target rather than the
# runner's OS version. Neither does the *machine* have to be the one the tag
# names — see the two `macos-14` entries below.
#
# The distribution is `grammar-of-data` and the import is `god`. Those are
# independent on purpose: `god` was taken on PyPI in 2016 by an unrelated
# package, and every example and every chapter says `import god` regardless.
#
# This uploads artifacts and stops. `python-release.yml` calls it and publishes
# what comes out, so the two triggers stay separate: every pull request proves
# the wheels still build, and only a tag sends them anywhere.

name: python wheels

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "py-pkg/**"
      - "god-core/**"
      - "god-cli/**"
      - ".github/workflows/python-wheels.yml"

jobs:
  wheels:
    name: ${{ matrix.tag }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            tag: macosx_11_0_arm64
            macos_target: "11.0"
          # The Intel wheel is cross-compiled from the Apple Silicon runner
          # rather than built on `macos-13`. That image is the last Intel one and
          # GitHub is retiring it; the sibling project measured a job that never
          # *started*, sitting queued for 55 minutes while four others finished
          # in minutes. A release that waits on a scarce runner is a release that
          # does not ship.
          - os: macos-14
            tag: macosx_10_12_x86_64
            macos_target: "10.12"
            rust_target: x86_64-apple-darwin
          # The manylinux image is what makes the wheel installable on any
          # reasonably modern Linux: it pins an old enough glibc that the binary
          # does not demand the build machine's.
          - os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
            tag: manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            tag: manylinux_2_28_aarch64
          - os: windows-latest
            tag: win_amd64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # A cross build lands in `target/<triple>/release/`, which is not where
      # `setup.py` looks, so it is pointed at the binary explicitly. The native
      # builds keep using the hook's own search.
      - name: Build the engine
        shell: bash
        run: |
          if [ -n "${{ matrix.rust_target }}" ]; then
            rustup target add "${{ matrix.rust_target }}"
            cargo build --release -p god-cli --target "${{ matrix.rust_target }}"
            echo "GOD_CLI=$PWD/target/${{ matrix.rust_target }}/release/god-cli" >> "$GITHUB_ENV"
          else
            cargo build --release -p god-cli
          fi
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}

      - name: Set up Python
        if: ${{ !matrix.container }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The manylinux image ships several Pythons and no `python` on PATH; any of
      # them can build this wheel, because it holds no compiled extension module.
      # That is also why one wheel per platform is enough rather than one per
      # interpreter version: the tag is `py3-none-<platform>`.
      - name: Build the wheel
        shell: bash
        run: |
          PYTHON=python
          if [ -n "${{ matrix.container }}" ]; then PYTHON=/opt/python/cp312-cp312/bin/python; fi
          "$PYTHON" -m pip install --upgrade build
          GOD_WHEEL_PLAT="${{ matrix.tag }}" "$PYTHON" -m build --wheel --outdir dist py-pkg/god

          # Assert rather than assume. `setup.py` raises if it can find no engine
          # at all, but nothing checks that the engine reached the *archive* — a
          # packaging rule that quietly stopped matching would ship a wheel that
          # installs and then cannot answer.
          "$PYTHON" - <<'PY'
          import glob, sys, zipfile
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          if not any(n.startswith("god/bin/god-cli") for n in names):
              print(f"::error::{wheel} carries no engine under god/bin/")
              sys.exit(1)
          print(f"{wheel} carries the engine")
          PY

      # The check that matters: install what was just built somewhere with no
      # checkout in sight, unset every hint, and answer a pipeline.
      #
      # The cross-compiled Intel wheel is the one entry that cannot always run
      # its own engine, because the runner is Apple Silicon and executing an
      # x86_64 binary there needs Rosetta. So the architecture is asserted from
      # the packed file either way, and the run is attempted only when Rosetta
      # answers — never skipped silently, and never softened into a check that
      # would pass on a broken engine.
      - name: Prove it answers with no toolchain and no checkout
        shell: bash
        run: |
          PYTHON=python
          if [ -n "${{ matrix.container }}" ]; then PYTHON=/opt/python/cp312-cp312/bin/python; fi

          # **A cross-compiled wheel cannot be pip-installed here, and that is
          # pip working correctly.** The Intel wheel is tagged
          # `macosx_10_12_x86_64` and this runner is Apple Silicon, so pip
          # refuses it on the tag before any check below is reached. Unpacking
          # asks what the artifact *contains*, which does not need it installed.
          if [ -n "${{ matrix.rust_target }}" ]; then
            WHEEL="$(ls dist/*.whl)"
            rm -rf /tmp/unpacked && mkdir -p /tmp/unpacked
            "$PYTHON" -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall('/tmp/unpacked')" "$WHEEL"

            ENGINE=/tmp/unpacked/god/bin/god-cli
            test -f "$ENGINE" || { echo "::error::the wheel carries no engine at god/bin/god-cli"; exit 1; }
            file "$ENGINE"
            file "$ENGINE" | grep -q "executable x86_64" \
              || { echo "::error::cross-compiled wheel does not carry an x86_64 engine"; exit 1; }

            if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
              echo "::warning::Rosetta is absent, so this runner cannot execute the Intel engine — architecture verified, answering not attempted"
              exit 0
            fi
            echo "Rosetta answers; running the Intel engine under it"
            chmod +x "$ENGINE"
            arch -x86_64 "$ENGINE" --columns "region:text,revenue:number" \
              <<< 'sales then keep where [region] is "West"' > /tmp/out.sql
            grep -qi "select" /tmp/out.sql \
              || { echo "::error::the Intel engine did not return a query"; cat /tmp/out.sql; exit 1; }
            echo "built $(wc -c < /tmp/out.sql) bytes of query with the shipped Intel engine"
            exit 0
          fi

          "$PYTHON" -m venv /tmp/check
          # Windows puts a venv's programs in `Scripts`, every other platform in
          # `bin`, and this job runs on both.
          BIN=/tmp/check/bin
          [ -d /tmp/check/Scripts ] && BIN=/tmp/check/Scripts
          "$BIN"/pip install dist/*.whl

          # The engine that actually shipped, wherever pip put it.
          ENGINE="$("$BIN"/python -c 'import god, os; print(os.path.join(os.path.dirname(god.__file__), "bin", "god-cli.exe" if os.name == "nt" else "god-cli"))')"
          test -f "$ENGINE" || { echo "::error::the wheel carries no engine at $ENGINE"; exit 1; }

          cd /tmp
          unset GOD_CLI
          "$BIN"/python -c "
          import god, pandas as pd
          sales = pd.DataFrame({'region': ['West', 'East', 'West'], 'revenue': [10.0, 20.0, 30.0]})
          out = god.run('sales then keep where [region] is \"West\"', sales=sales)
          assert len(out) == 2, out
          assert set(out['region']) == {'West'}, out
          print('answered', len(out), 'rows with the shipped engine, version', god.__version__)
          "

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.tag }}
          path: dist/*.whl
