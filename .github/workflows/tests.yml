# Every test the tree has, on every push and every pull request.
#
# The book workflow proves the manual renders and publishes it; until this file
# nothing in CI proved the engine, either package, or parity. A book that
# renders is not evidence the answers are right — the printing backends have
# already shipped five defects that read correctly and meant something else,
# and every one was caught by a harness that somebody ran. This file is that
# somebody, on every change.
#
# What runs, cheapest evidence first:
#
#   cargo test          the core: parsing, checking, every backend, and the
#                       verbs executed on DuckDB with the rows read back
#   the R suite         the binding, the translator, and the book guards it
#                       carries
#   the Python suite    the binding, plus the vocabulary, printed-code and
#                       Spark harnesses it orchestrates (Spark skips here —
#                       pyspark and a JVM are not installed — and the suite
#                       says in as many words that a skip is not a pass)
#   parity/check.py     one corpus, three spellings, four witnesses each
#
# Actions are pinned to commits, the same way book.yml pins them, so the two
# workflows age together; the tag each pin was taken from is beside it.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Built explicitly: the suites and harnesses below find the engine by
      # walking up to `target/release/god-cli`, and a passing `cargo test` is
      # not evidence the binary was rebuilt.
      - name: Build the engine
        run: |
          cargo build --release -p god-cli
          test -x target/release/god-cli

      - name: The Rust suite
        run: cargo test --release

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          use-public-rspm: true

      # DBI and duckdb come from the package's own DESCRIPTION; pkgload is how
      # the suite attaches the package from source.
      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          working-directory: r-pkg/god
          extra-packages: any::pkgload

      # polars is here for parity/printed.py, which executes the polars
      # rendering of every corpus sentence — the check that caught `to_date`
      # throwing the time away.
      #
      # pyarrow is not decoration and is not polars' own dependency. That
      # harness compares tables by bringing each rendering back to pandas, and
      # `polars.DataFrame.to_pandas()` goes through Arrow, so without it all 69
      # polars sentences report "would not run". The suite is written so a skip
      # is a failure rather than a pass, which is what turned a missing wheel
      # into a red job instead of a quietly unchecked backend. It is installed
      # everywhere anything imports pandas *and* polars, which is why this was
      # invisible until CI ran on a machine that had only what was asked for.
      - name: Python for the suite and the harnesses
        run: python3 -m pip install --quiet pandas duckdb polars pyarrow

      - name: The R suite, and the book guards inside it
        run: Rscript r-pkg/god/tests/test_basic.R

      - name: The Python suite, and the harnesses inside it
        run: python3 py-pkg/god/tests/test_basic.py

      - name: Parity, four witnesses per sentence
        run: python3 parity/check.py
